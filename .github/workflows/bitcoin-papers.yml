
name: Bitcoin Papers Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}

    steps:
      - name: 下载仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 搜索比特币论文
        run: python main.py

      - name: 保存论文结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bitcoin_papers.csv
          git diff --cached --quiet || git commit -m "Update Bitcoin papers"
          git push
